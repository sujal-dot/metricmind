
version: 2

models:
  - name: stg_fact_sales
    description: "Staging model for fact_sales"
    columns:
      - name: sales_key
        description: "Primary key for sales transaction"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      - name: sales_amount
        description: "Sales amount for the transaction"
        tests:
          - not_null
      - name: quantity
        description: "Quantity sold"
        tests:
          - not_null

  - name: stg_dim_customer
    description: "Staging model for dim_customer"
    columns:
      - name: customer_key
        description: "Primary key for customer"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null

  - name: stg_dim_product
    description: "Staging model for dim_product"
    columns:
      - name: product_key
        description: "Primary key for product"
        tests:
          - unique
          - not_null
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null

  - name: stg_dim_date
    description: "Staging model for dim_date"
    columns:
      - name: date_key
        description: "Primary key for date"
        tests:
          - unique
          - not_null
      - name: full_date
        description: "Full date"
        tests:
          - not_null

  - name: stg_dim_region
    description: "Staging model for dim_region"
    columns:
      - name: region_key
        description: "Primary key for region"
        tests:
          - unique
          - not_null

  - name: stg_dim_employee
    description: "Staging model for dim_employee"
    columns:
      - name: employee_key
        description: "Primary key for employee"
        tests:
          - unique
          - not_null
