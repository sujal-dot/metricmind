version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: metricmind-postgres
    environment:
      POSTGRES_USER: metricmind
      POSTGRES_PASSWORD: metricmind
      POSTGRES_DB: metricmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metricmind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

